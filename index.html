<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ── Reset & Tokens ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0f11;
    --surface:   #16181c;
    --border:    #2a2d34;
    --muted:     #3d424e;
    --text:      #e8eaf0;
    --sub:       #8b90a0;
    --accent:    #f0c060;
    --accent2:   #e08830;
    --user-bg:   #1e2128;
    --ai-bg:     #13151a;
    --danger:    #e05555;
    --green:     #4caf86;
    --radius:    10px;
    --font:      'Sora', sans-serif;
    --font-head: 'Playfair Display', serif;
    --sidebar-w: 260px;
    --trans:     0.18s ease;
  }

  body { font-family: var(--font); background: var(--bg); color: var(--text);
         font-size: 14px; line-height: 1.6; height: 100dvh; overflow: hidden; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 99px; }

  /* ── Auth Layer ── */
  #auth-layer {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: var(--bg); z-index: 100;
  }
  #auth-layer.hidden { display: none; }

  .auth-box {
    width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px;
  }
  .auth-logo { font-family: var(--font-head); font-size: 28px; color: var(--accent);
               text-align: center; letter-spacing: .5px; }
  .auth-logo span { color: var(--sub); font-family: var(--font); font-size: 13px;
                    font-weight: 300; display: block; margin-top: 2px; }

  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer;
              color: var(--sub); font-size: 13px; font-weight: 500;
              border-bottom: 2px solid transparent; margin-bottom: -1px;
              transition: color var(--trans), border-color var(--trans); }
  .auth-tab.active { color: var(--accent); border-color: var(--accent); }

  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .auth-form.hidden { display: none; }

  label { font-size: 12px; color: var(--sub); margin-bottom: 4px; display: block; }
  .field { display: flex; flex-direction: column; }

  input[type=text], input[type=email], input[type=password] {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--font); font-size: 14px;
    padding: 10px 12px; outline: none; transition: border-color var(--trans);
  }
  input:focus { border-color: var(--accent); }

  .btn {
    padding: 11px 20px; border-radius: var(--radius); border: none;
    font-family: var(--font); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: opacity var(--trans), background var(--trans);
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #111; }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--sub); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  .btn-danger { background: var(--danger); color: #fff; }

  .auth-alt { font-size: 12px; color: var(--sub); text-align: center; cursor: pointer; }
  .auth-alt a { color: var(--accent); text-decoration: none; }
  .auth-alt a:hover { text-decoration: underline; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 99px; font-size: 13px;
    transition: transform .3s ease, opacity .3s ease; opacity: 0; z-index: 999;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err  { border-color: var(--danger); color: var(--danger); }
  #toast.ok   { border-color: var(--green);  color: var(--green);  }

  /* ── App Shell ── */
  #app { display: flex; height: 100dvh; }
  #app.hidden { display: none; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  }
  .sidebar-header {
    padding: 18px 16px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: var(--font-head); font-size: 20px; color: var(--accent); }
  .btn-new { background: var(--muted); color: var(--text); border: none; cursor: pointer;
             padding: 6px 12px; border-radius: var(--radius); font-size: 13px;
             font-family: var(--font); transition: background var(--trans); }
  .btn-new:hover { background: var(--accent); color: #111; }

  #session-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .session-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    transition: background var(--trans); gap: 6px;
  }
  .session-item:hover { background: var(--muted); }
  .session-item.active { background: var(--user-bg); border: 1px solid var(--border); }
  .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; font-size: 13px; }
  .session-del { color: var(--sub); font-size: 16px; line-height: 1; padding: 2px 4px;
                 border-radius: 4px; transition: color var(--trans), background var(--trans);
                 cursor: pointer; flex-shrink: 0; }
  .session-del:hover { color: var(--danger); background: rgba(224,85,85,.12); }

  .sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .user-info { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .user-info strong { display: block; color: var(--text); font-size: 13px; }

  /* ── Main Chat ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #chat-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
  }
  #session-name { font-weight: 500; font-size: 15px; }
  .header-badges { display: flex; gap: 8px; align-items: center; }

  .toggle-wrap { display: flex; align-items: center; gap: 6px; }
  .toggle-label { font-size: 12px; color: var(--sub); }
  .toggle {
    position: relative; width: 32px; height: 18px; cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: var(--muted); border-radius: 99px;
    transition: background var(--trans);
  }
  .toggle-slider::before {
    content: ''; position: absolute; width: 12px; height: 12px; border-radius: 50%;
    left: 3px; top: 3px; background: #fff; transition: transform var(--trans);
  }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(14px); }

  /* ── Messages ── */
  #messages {
    flex: 1; overflow-y: auto; padding: 24px 20px; display: flex;
    flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 12px; max-width: 820px; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; margin-top: 2px;
  }
  .msg.user .avatar { background: var(--accent); color: #111; }
  .msg.assistant .avatar { background: var(--muted); color: var(--text); }

  .bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.65;
    max-width: 640px;
  }
  .msg.user .bubble { background: var(--user-bg); border: 1px solid var(--border);
                       border-top-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--ai-bg); border: 1px solid var(--border);
                             border-top-left-radius: 4px; }

  /* Markdown in bubbles */
  .bubble h1,.bubble h2,.bubble h3 { margin: .6em 0 .3em; font-weight: 600; }
  .bubble p { margin-bottom: .5em; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul,.bubble ol { padding-left: 1.4em; margin-bottom: .5em; }
  .bubble code {
    background: #1e2430; border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-size: 12.5px; font-family: 'Fira Mono', monospace;
  }
  .bubble pre { background: #1e2430; border: 1px solid var(--border); border-radius: 8px;
                padding: 12px; overflow-x: auto; margin: .6em 0; }
  .bubble pre code { background: none; border: none; padding: 0; }
  .bubble a { color: var(--accent); }
  .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 10px;
                       color: var(--sub); margin: .4em 0; }

  .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                background: var(--sub); animation: blink 1.2s infinite; margin: 0 1px; }
  .typing-dot:nth-child(2) { animation-delay: .2s; }
  .typing-dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--sub); text-align: center;
  }
  .empty-state .big { font-family: var(--font-head); font-size: 36px;
                       color: var(--accent); opacity: .35; }

  /* ── Input Bar ── */
  #input-bar {
    padding: 14px 20px 18px; border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  #msg-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--font); font-size: 14px;
    padding: 10px 14px; resize: none; outline: none; min-height: 44px; max-height: 140px;
    line-height: 1.5; transition: border-color var(--trans);
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--sub); }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--sub); cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    transition: color var(--trans), border-color var(--trans), background var(--trans);
    font-size: 18px;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }
  .icon-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(240,192,96,.08); }
  .icon-btn.send { background: var(--accent); color: #111; border-color: var(--accent); }
  .icon-btn.send:hover { background: var(--accent2); }
  .icon-btn.send:disabled { opacity: .4; cursor: not-allowed; }
  .icon-btn.recording { color: var(--danger); border-color: var(--danger);
                         background: rgba(224,85,85,.1); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  #file-input { display: none; }
  .attach-preview {
    display: flex; align-items: center; gap: 8px; padding: 6px 0 2px;
    font-size: 12px; color: var(--sub);
  }
  .attach-preview .rm { cursor: pointer; color: var(--danger); }

  /* ── Utility ── */
  .hidden { display: none !important; }
  .flex-gap { display: flex; gap: 8px; }
  .mt-4 { margin-top: 16px; }
</style>
</head>
<body>

<!-- ── Toast ─────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Auth Layer ─────────────────────────────────────── -->
<div id="auth-layer">
  <div class="auth-box">
    <div class="auth-logo">Aura <span>AI Assistant</span></div>

    <!-- Tabs -->
    <div class="auth-tabs" id="auth-tabs">
      <div class="auth-tab active" data-tab="login">Sign in</div>
      <div class="auth-tab" data-tab="signup">Create account</div>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="form-login" onsubmit="return false">
      <div class="field"><label>Email</label>
        <input type="email" id="l-email" placeholder="you@example.com" required /></div>
      <div class="field"><label>Password</label>
        <input type="password" id="l-pw" placeholder="••••••••" required /></div>
      <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
      <div class="auth-alt"><a onclick="showForgot()">Forgot password?</a></div>
    </form>

    <!-- Signup Form -->
    <form class="auth-form hidden" id="form-signup" onsubmit="return false">
      <div class="field"><label>Email</label>
        <input type="email" id="s-email" placeholder="you@example.com" required /></div>
      <div class="field"><label>Username</label>
        <input type="text" id="s-user" placeholder="letters, numbers, underscores (3-30)" required /></div>
      <div class="field"><label>Password</label>
        <input type="password" id="s-pw" placeholder="min 8 characters" required /></div>
      <button class="btn btn-primary" onclick="doSignup()">Create account</button>
    </form>

    <!-- Forgot Password Form -->
    <form class="auth-form hidden" id="form-forgot" onsubmit="return false">
      <div class="field"><label>Email address</label>
        <input type="email" id="f-email" placeholder="you@example.com" required /></div>
      <button class="btn btn-primary" onclick="doForgot()">Send reset link</button>
      <div class="auth-alt"><a onclick="showTab('login')">← Back to sign in</a></div>
    </form>

    <!-- Reset Password Form -->
    <form class="auth-form hidden" id="form-reset" onsubmit="return false">
      <div class="field"><label>New Password</label>
        <input type="password" id="r-pw" placeholder="min 8 characters" required /></div>
      <button class="btn btn-primary" onclick="doReset()">Reset password</button>
    </form>
  </div>
</div>

<!-- ── App Shell ───────────────────────────────────────── -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="logo">Aura</span>
      <button class="btn-new" onclick="newChat()">+ New</button>
    </div>
    <div id="session-list">
      <div class="empty-state" style="flex:none;padding:20px 0;font-size:12px;">No chats yet</div>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <strong id="uname-display">—</strong>
        <span id="email-display">—</span>
      </div>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="logout()">Out</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- Header -->
    <div id="chat-header">
      <span id="session-name">Select or start a chat</span>
      <div class="header-badges">
        <div class="toggle-wrap">
          <label class="toggle"><input type="checkbox" id="toggle-rag" checked />
            <span class="toggle-slider"></span></label>
          <span class="toggle-label">RAG</span>
        </div>
        <div class="toggle-wrap">
          <label class="toggle"><input type="checkbox" id="toggle-web" />
            <span class="toggle-slider"></span></label>
          <span class="toggle-label">Web</span>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages">
      <div class="empty-state">
        <div class="big">✦</div>
        <div>Start a conversation</div>
      </div>
    </div>

    <!-- Input Bar -->
    <div id="input-bar">
      <div id="attach-preview" class="attach-preview hidden"></div>
      <div class="input-row">
        <!-- File upload -->
        <input type="file" id="file-input" accept="image/*,.pdf,.txt,.csv"
               onchange="handleFileSelect()" />
        <button class="icon-btn" title="Attach file" onclick="document.getElementById('file-input').click()">📎</button>

        <!-- Voice -->
        <button class="icon-btn" id="voice-btn" title="Voice input" onclick="toggleVoice()">🎤</button>

        <!-- Message input -->
        <textarea id="msg-input" rows="1" placeholder="Message Aura…"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
          oninput="autoResize(this)"></textarea>

        <!-- Send -->
        <button class="icon-btn send" id="send-btn" title="Send" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   State
═══════════════════════════════════════════════════════════ */
let token       = localStorage.getItem('aura_token') || '';
let currentUser = null;
let currentSid  = null;   // active session id
let streaming   = false;
let recognition = null;
let pendingFile = null;   // { id, url, caption }

const API = '';            // same origin

/* ═══════════════════════════════════════════════════════════
   Boot
═══════════════════════════════════════════════════════════ */
window.onload = async () => {
  // Check for reset token in URL
  const params = new URLSearchParams(location.search);
  if (params.has('token')) {
    showResetForm(params.get('token'));
    return;
  }
  if (token) {
    try {
      const me = await api('GET', '/api/auth/me');
      enterApp(me);
    } catch { token = ''; localStorage.removeItem('aura_token'); }
  }
};

/* ═══════════════════════════════════════════════════════════
   API helper
═══════════════════════════════════════════════════════════ */
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = `Bearer ${token}`;
  if (body)  opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Request failed');
  }
  return res.json();
}

/* ═══════════════════════════════════════════════════════════
   Toast
═══════════════════════════════════════════════════════════ */
let _toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

/* ═══════════════════════════════════════════════════════════
   Auth — tab switching
═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.auth-tab').forEach(t =>
  t.addEventListener('click', () => showTab(t.dataset.tab))
);

function showTab(name) {
  document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('form-' + name).classList.remove('hidden');
  document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');
}

function showForgot() {
  document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('form-forgot').classList.remove('hidden');
}

function showResetForm(tok) {
  document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('form-reset').classList.remove('hidden');
  document.getElementById('form-reset')._tok = tok;
}

/* ═══════════════════════════════════════════════════════════
   Auth — actions
═══════════════════════════════════════════════════════════ */
async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-pw').value;
  if (!email || !password) return toast('Fill in all fields', 'err');
  try {
    const res = await api('POST', '/api/auth/login', { email, password });
    token = res.token;
    localStorage.setItem('aura_token', token);
    enterApp(res);
  } catch (e) { toast(e.message, 'err'); }
}

async function doSignup() {
  const email    = document.getElementById('s-email').value.trim();
  const username = document.getElementById('s-user').value.trim();
  const password = document.getElementById('s-pw').value;
  if (!email || !username || !password) return toast('Fill in all fields', 'err');
  try {
    const res = await api('POST', '/api/auth/signup', { email, username, password });
    token = res.token;
    localStorage.setItem('aura_token', token);
    enterApp(res);
  } catch (e) { toast(e.message, 'err'); }
}

async function doForgot() {
  const email = document.getElementById('f-email').value.trim();
  if (!email) return toast('Enter your email', 'err');
  try {
    const res = await api('POST', '/api/auth/forgot-password', { email });
    toast(res.message, 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function doReset() {
  const form = document.getElementById('form-reset');
  const tok  = form._tok;
  const pw   = document.getElementById('r-pw').value;
  if (!pw) return toast('Enter a new password', 'err');
  try {
    const res = await api('POST', '/api/auth/reset-password', { token: tok, new_password: pw });
    toast(res.message, 'ok');
    setTimeout(() => { history.replaceState({}, '', '/'); showTab('login'); }, 1500);
  } catch (e) { toast(e.message, 'err'); }
}

/* ═══════════════════════════════════════════════════════════
   App Entry / Exit
═══════════════════════════════════════════════════════════ */
async function enterApp(user) {
  currentUser = user;
  document.getElementById('auth-layer').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('uname-display').textContent = user.username;
  document.getElementById('email-display').textContent  = user.email;
  await loadSessions();
}

function logout() {
  token = ''; currentUser = null; currentSid = null;
  localStorage.removeItem('aura_token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth-layer').classList.remove('hidden');
  showTab('login');
}

/* ═══════════════════════════════════════════════════════════
   Sessions
═══════════════════════════════════════════════════════════ */
async function loadSessions() {
  try {
    const sessions = await api('GET', '/api/sessions');
    renderSessions(sessions);
  } catch (e) { toast(e.message, 'err'); }
}

function renderSessions(sessions) {
  const list = document.getElementById('session-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="empty-state" style="flex:none;padding:20px 0;font-size:12px;">No chats yet</div>';
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="session-item${s.id === currentSid ? ' active' : ''}" data-id="${s.id}" onclick="loadSession('${s.id}')">
      <span class="session-title">${esc(s.title)}</span>
      <span class="session-del" title="Delete" onclick="delSession(event,'${s.id}')">×</span>
    </div>`).join('');
}

async function newChat() {
  currentSid = null;
  document.getElementById('session-name').textContent = 'New Chat';
  document.getElementById('messages').innerHTML = `
    <div class="empty-state"><div class="big">✦</div><div>Start a conversation</div></div>`;
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  pendingFile = null;
  updateAttachPreview();
}

async function loadSession(id) {
  currentSid = id;
  try {
    const msgs = await api('GET', `/api/sessions/${id}/messages`);
    const sessions = await api('GET', '/api/sessions');
    const s = sessions.find(x => x.id === id);
    document.getElementById('session-name').textContent = s?.title || 'Chat';
    renderSessions(sessions);
    const box = document.getElementById('messages');
    if (!msgs.length) {
      box.innerHTML = '<div class="empty-state"><div class="big">✦</div><div>No messages yet</div></div>';
      return;
    }
    box.innerHTML = '';
    msgs.forEach(m => appendMessage(m.role, m.content));
    box.scrollTop = box.scrollHeight;
  } catch (e) { toast(e.message, 'err'); }
}

async function delSession(ev, id) {
  ev.stopPropagation();
  if (!confirm('Delete this chat?')) return;
  try {
    await api('DELETE', `/api/sessions/${id}`);
    if (currentSid === id) newChat();
    await loadSessions();
    toast('Chat deleted');
  } catch (e) { toast(e.message, 'err'); }
}

/* ═══════════════════════════════════════════════════════════
   Messages — render
═══════════════════════════════════════════════════════════ */
function appendMessage(role, content) {
  const box  = document.getElementById('messages');
  const empty = box.querySelector('.empty-state');
  if (empty) empty.remove();

  const initials = role === 'user'
    ? (currentUser?.username?.[0] || 'U').toUpperCase()
    : 'A';

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${initials}</div>
    <div class="bubble">${role === 'assistant' ? marked.parse(content) : esc(content).replace(/\n/g,'<br>')}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function appendTyping() {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-msg';
  div.innerHTML = `<div class="avatar">A</div>
    <div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

/* ═══════════════════════════════════════════════════════════
   Send Message (SSE streaming)
═══════════════════════════════════════════════════════════ */
async function sendMessage() {
  if (streaming) return;
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text && !pendingFile) return;

  const useRag = document.getElementById('toggle-rag').checked;
  const useWeb = document.getElementById('toggle-web').checked;

  input.value = '';
  autoResize(input);

  // Show user message
  const displayText = pendingFile
    ? `${text ? text + '\n' : ''}📎 ${pendingFile.filename || 'file attached'}`
    : text;
  appendMessage('user', displayText);

  // Typing indicator
  const typingEl = appendTyping();
  streaming = true;
  document.getElementById('send-btn').disabled = true;

  // Clear attachment
  const fileRef = pendingFile ? pendingFile.url : undefined;
  pendingFile = null;
  updateAttachPreview();

  try {
    const body = {
      message:        text || '(see attached file)',
      session_id:     currentSid || undefined,
      use_rag:        useRag,
      use_web_search: useWeb,
      stream:         true,
    };

    const res = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${token}`,
      },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Chat failed');
    }

    // Replace typing dots with streaming bubble
    typingEl.remove();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg assistant';
    msgDiv.innerHTML = `<div class="avatar">A</div><div class="bubble" id="stream-bubble"></div>`;
    document.getElementById('messages').appendChild(msgDiv);
    const bubble = document.getElementById('stream-bubble');

    let raw = '';
    const reader = res.body.getReader();
    const dec    = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = dec.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;
        if (payload.startsWith('[META]')) {
          try {
            const meta = JSON.parse(payload.slice(6));
            if (!currentSid || currentSid !== meta.session_id) {
              currentSid = meta.session_id;
              document.getElementById('session-name').textContent = meta.session_title || 'Chat';
              loadSessions();
            }
          } catch {}
          continue;
        }
        raw += payload.replace(/\\n/g, '\n');
        bubble.innerHTML = marked.parse(raw);
        document.getElementById('messages').scrollTop = 9999;
      }
    }
  } catch (e) {
    typingEl?.remove();
    document.getElementById('stream-bubble')?.parentElement?.remove();
    appendMessage('assistant', '⚠ ' + e.message);
    toast(e.message, 'err');
  }

  streaming = false;
  document.getElementById('send-btn').disabled = false;
}

/* ═══════════════════════════════════════════════════════════
   File Upload
═══════════════════════════════════════════════════════════ */
async function handleFileSelect() {
  const fileInput = document.getElementById('file-input');
  const file = fileInput.files[0];
  fileInput.value = '';
  if (!file) return;

  const fd = new FormData();
  fd.append('file', file);
  if (currentSid) fd.append('session_id', currentSid);

  toast('Uploading…');
  try {
    const res = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: fd,
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
    const data = await res.json();
    pendingFile = { ...data, filename: data.filename };
    updateAttachPreview();
    toast('File attached ✓', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

function updateAttachPreview() {
  const el = document.getElementById('attach-preview');
  if (!pendingFile) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');
  el.innerHTML = `<span>📎 ${esc(pendingFile.filename)}</span>
    <span class="rm" onclick="pendingFile=null;updateAttachPreview()">✕</span>`;
}

/* ═══════════════════════════════════════════════════════════
   Voice — Web Speech API
═══════════════════════════════════════════════════════════ */
function toggleVoice() {
  const btn = document.getElementById('voice-btn');
  const SR  = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice not supported in this browser', 'err'); return; }

  if (recognition) {
    recognition.stop(); recognition = null;
    btn.classList.remove('recording');
    return;
  }
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = ev => {
    const t = ev.results[0][0].transcript;
    const inp = document.getElementById('msg-input');
    inp.value += (inp.value ? ' ' : '') + t;
    autoResize(inp);
  };
  recognition.onerror  = () => { toast('Voice error', 'err'); };
  recognition.onend    = () => { recognition = null; btn.classList.remove('recording'); };

  recognition.start();
  btn.classList.add('recording');
}

/* ═══════════════════════════════════════════════════════════
   Utilities
═══════════════════════════════════════════════════════════ */
function esc(s = '') {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}
</script>
